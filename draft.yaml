models:
  Versement:
    id: id
    user_id: id foreign:users
    description: text nullable
    montant: double
    date_transaction: date
    timestamps: true
    relationships:
      belongsTo: User

  VersementType:
    id: id
    name: string:100
    description: text nullable
    timestamps: true

seeders:
  - Versement
  - VersementType

controllers:
  Versement:
    resource: web
  VersementType:
    resource: web

